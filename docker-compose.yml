services:
  app:
    build: .
    image: logistics-agent:latest
    ports:
      - "8000:8000"
    environment:
      LOGIAGENT_LLM_API_KEY: ${LOGIAGENT_LLM_API_KEY:-}
      LOGIAGENT_LLM_BASE_URL: ${LOGIAGENT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      LOGIAGENT_LLM_MODEL: ${LOGIAGENT_LLM_MODEL:-deepseek-chat}
      LOGIAGENT_PRICE_INPUT_PER_1K: ${LOGIAGENT_PRICE_INPUT_PER_1K:-0.002}
      LOGIAGENT_PRICE_OUTPUT_PER_1K: ${LOGIAGENT_PRICE_OUTPUT_PER_1K:-0.008}
    volumes:
      - ./var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
