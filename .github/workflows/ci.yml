name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    name: Python tests & evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit / integration tests
        run: make test
      - name: Main eval + review + judge + redteam + perf
        run: make eval
      - name: Metric gate
        run: make gate
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/report/*.md

  web:
    name: AntD build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python web deps
        run: pip install -r requirements-web.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Export OpenAPI
        run: python -m src.app.api --dump-openapi web/openapi.json
      - name: Generate TS types & build
        working-directory: web
        run: |
          pnpm gen:types
          pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: logistics-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
